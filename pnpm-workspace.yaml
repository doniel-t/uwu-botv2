# Packages allowed to run install scripts (native builds).
# pnpm 10 (used in the Dockerfile) reads onlyBuiltDependencies.
onlyBuiltDependencies:
  - '@discordjs/opus'
  - better-sqlite3
  - bufferutil
  - canvas
  - erlpack
  - ffmpeg-static
  - utf-8-validate
  - zlib-sync

# pnpm 11+ reads allowBuilds instead.
allowBuilds:
  '@discordjs/opus': true
  better-sqlite3: true
  bufferutil: true
  canvas: true
  erlpack: true
  ffmpeg-static: true
  utf-8-validate: true
  zlib-sync: true
  '@openrouter/sdk': false
